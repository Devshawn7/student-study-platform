
<!DOCTYPE html>
<html>
<head>
<title>Adaptive Learning Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;padding:20px;max-width:900px;margin:auto}
input{width:100%;padding:10px;margin:5px 0}
button{padding:10px 20px}
.card{padding:15px;border:1px solid #ddd;border-radius:10px;margin-top:20px}
</style>
</head>
<body>
<h1>Adaptive Learning Assistant</h1>
<form method="post">
<input name="study_hours" placeholder="Study Hours" required>
<input name="quiz" placeholder="Quiz Score" required>
<input name="assignment" placeholder="Assignment Score" required>
<input name="attendance" placeholder="Attendance %" required>
<input name="gpa" placeholder="Previous GPA" required>
<button type="submit">Analyze</button>
</form>

{% if result %}
<div class="card">
<h2>Predicted Final Score: {{result}}%</h2>
<h3>Cognitive Score: {{cognitive}}</h3>
<p>Recommendation: Increase study time, maintain attendance above 85%, and practice regularly.</p>
</div>
{% endif %}
</body>
</html>
